# Blocage des sondes « Server Actions » — à insérer dans le bloc server 443 de
# /etc/nginx/sites-available/cazadvf.fr, juste AVANT « location / ».
#
# Pourquoi
# --------
# L'application n'utilise AUCUNE Server Action Next.js : il n'existe pas une seule
# directive "use server" dans app/ ni lib/. Toute requête portant l'en-tête
# `Next-Action` est donc nécessairement illégitime.
#
# Ce sont des scanners qui sondent les CVE liées aux Server Actions. Les identifiants
# demandés le trahissent : "x" (33 392 fois), "0", "1", "action", "xxx", "true"…
# L'agent principal est watchTowr (société de recherche en sécurité), depuis des IP
# AWS 54.247.251.0/24.
#
# Next.js les rejette correctement (307/400), mais journalise une trace complète à
# chaque tentative : 58 285 « Failed to find Server Action » et 1 337 « Cannot read
# properties of undefined (reading 'bind') » avaient rempli 80 Mo de log, au point de
# rendre les vraies erreurs introuvables.
#
# On coupe donc avant que la requête n'atteigne Next.js. 444 ferme la connexion sans
# répondre : c'est le moins coûteux face à un scanner.
#
# ATTENTION
# ---------
# À RETIRER si l'application adopte un jour les Server Actions, sinon elles seront
# silencieusement cassées en production.

if ($http_next_action) {
    return 444;
}
